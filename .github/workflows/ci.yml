name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev

      - name: Test
        run: dotnet test Baird.Tests/Baird.Tests.csproj

  # Build exactly what ships (trimmed, single-file linux-arm64 via build.sh)
  # and check it actually starts, on a native arm64 runner.
  publish-smoke-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libmpv2

      - name: Build (build.sh)
        run: ./build.sh

      - name: Startup smoke test
        run: ./smoke_test.sh publish/linux-arm64/Baird
