name: Shortcut

# Builds the "Play on Baird" iPhone Shortcut from shortcut/build_shortcut.py and signs it ("anyone" mode): iOS only
# imports signed Shortcuts. The signed file is uploaded as the "shortcut" artifact; the release puts it in Baird's zip,
# and Baird serves it to phones (Settings > Connect a phone).
#
# Signing needs a Mac signed into iCloud, which GitHub's own Macs aren't ("In order to do this, you must be signed
# into iCloud"), so it only works on a self-hosted Mac. Until then the Shortcut is built by hand on an iPhone and
# installed from its iCloud link (Baird:ShortcutLink). Signing is allowed to fail (the artifact is then missing) so
# it never blocks a Baird release.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  shortcut:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build (unsigned)
        run: |
          mkdir -p out
          python3 shortcut/build_shortcut.py out/unsigned.shortcut
          plutil -lint out/unsigned.shortcut

      - name: Sign on the Mac
        id: mac
        continue-on-error: true
        timeout-minutes: 5
        run: shortcuts sign --mode anyone --input out/unsigned.shortcut --output "out/Play on Baird.shortcut"

      # A signed Shortcut is an Apple Encrypted Archive: it starts "AEA1".
      - name: Check it's signed
        id: signed
        continue-on-error: true
        run: |
          test -f "out/Play on Baird.shortcut"
          test "$(head -c 4 "out/Play on Baird.shortcut")" = "AEA1"
          ls -l out

      - name: Upload signed Shortcut
        if: steps.signed.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: shortcut
          path: out/Play on Baird.shortcut
          if-no-files-found: error

      - name: Say if signing failed
        if: steps.signed.outcome != 'success'
        run: echo "::warning::The Shortcut couldn't be signed; Baird ships without it."
