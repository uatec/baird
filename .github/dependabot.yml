version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: docker
    directory: "/spikes/rive-avalonia-spike/native"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: nuget
    directories:
      - "/Baird"
      - "/Baird.Tests"
      - "/KeysCheck"
      - "/TypeInspector"
      - "/spikes/wayland-overlay/OverlayTest"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
